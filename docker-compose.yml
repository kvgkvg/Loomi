version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: loomi-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: loomi
      POSTGRES_PASSWORD: loomi
      POSTGRES_DB: loomi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loomi"]
      interval: 5s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:0.5.3
    container_name: loomi-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: loomi-core
    ports:
      - "8002:8000"
    working_dir: /watched-repo
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://loomi:loomi@postgres:5432/loomi
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - LOOMI_REPO_PATH=/watched-repo
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - FEATHERLESS_API_KEY=${FEATHERLESS_API_KEY:-}
    volumes:
      - .:/app
      - ${LOOMI_WATCH_REPO:-../test_loomi_repo}:/watched-repo
      - core_model_cache:/root/.cache/chroma
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: loomi-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - CORE_URL=http://core:8000
    depends_on:
      - core
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loomi-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - api

volumes:
  postgres_data:
  chroma_data:
  core_model_cache:
